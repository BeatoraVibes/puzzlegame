<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Pro</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at center, #1a1a1a, #000);
    color: white;
}

/* SCREENS */
.screen {
    display: none;
    text-align: center;
    padding: 20px;
}

.active {
    display: block;
}

/* ENTRY SCREEN */
input {
    padding: 10px;
    width: 300px;
    margin: 5px;
    border-radius: 5px;
    border: none;
}

.start-btn {
    padding: 12px 25px;
    background: gold;
    border: none;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

/* GAME UI */
.header {
    font-size: 28px;
    margin-bottom: 10px;
}

/* SCOREBOARD */
.scoreboard {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 15px;
}

.player {
    padding: 10px 20px;
    background: #222;
    border-radius: 10px;
}

.active-player {
    border: 2px solid gold;
}

/* WHEEL */
.wheel-box {
    margin: 20px auto;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: conic-gradient(
        gold 0deg 40deg,
        red 40deg 80deg,
        green 80deg 120deg,
        blue 120deg 160deg,
        orange 160deg 200deg,
        purple 200deg 240deg,
        pink 240deg 280deg,
        cyan 280deg 320deg,
        yellow 320deg 360deg
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.spin-btn {
    margin-top: 10px;
    padding: 10px 20px;
    background: gold;
    border: none;
    cursor: pointer;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(12, 45px);
    gap: 8px;
    justify-content: center;
    margin: 20px;
}

.cell {
    width: 45px;
    height: 45px;
    background: #111;
    border: 2px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.hidden {
    background: #222;
}

/* KEYBOARD */
.keyboard {
    max-width: 800px;
    margin: auto;
}

.keyboard button {
    width: 40px;
    height: 40px;
    margin: 4px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
}

.used {
    background: grey !important;
    pointer-events: none;
}

/* ACTION BUTTONS */
.actions button {
    padding: 10px 15px;
    margin: 10px;
    background: gold;
    border: none;
    cursor: pointer;
}

</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="entryScreen" class="screen active">
    <h1>🎡 Setup Game</h1>
    <input id="p1" placeholder="Round 1 Puzzle"><br>
    <input id="p2" placeholder="Round 2 Puzzle"><br>
    <input id="p3" placeholder="Round 3 Puzzle"><br>
    <input id="p4" placeholder="Final Puzzle"><br>
    <button class="start-btn" onclick="startGame()">Start Game</button>
</div>

<!-- SCREEN 2 -->
<div id="gameScreen" class="screen">

    <div class="header" id="roundTitle"></div>

    <div class="scoreboard" id="scoreboard"></div>

    <div class="wheel-box" id="wheelDisplay">SPIN</div>
    <button class="spin-btn" onclick="spinWheel()">Spin</button>

    <h2 id="wheelResult"></h2>

    <div class="grid" id="grid"></div>

    <div class="keyboard" id="keyboard"></div>

    <div class="actions">
        <button onclick="buyVowel()">Buy Vowel (-₹100)</button>
        <button onclick="nextRound()">Next Round</button>
    </div>

</div>

<script>

let puzzles = [];
let currentRound = 0;
let players = [0,0,0];
let currentPlayer = 0;
let currentPuzzle = "";
let revealed = [];

const wheelValues = [
    100,200,500,1000,2000,5000,10000,50000,100000,
    "SNAKE","LOSE"
];

function startGame(){
    puzzles = [
        p1.value.toUpperCase(),
        p2.value.toUpperCase(),
        p3.value.toUpperCase(),
        p4.value.toUpperCase()
    ];

    document.getElementById("entryScreen").classList.remove("active");
    document.getElementById("gameScreen").classList.add("active");

    loadRound();
}

function loadRound(){
    currentPuzzle = puzzles[currentRound];
    revealed = Array(currentPuzzle.length).fill(false);

    document.getElementById("roundTitle").innerText =
        currentRound === 3 ? "FINAL ROUND" : "ROUND " + (currentRound+1);

    renderGrid();
    renderKeyboard();
    updateScores();
}

function renderGrid(){
    grid.innerHTML = "";

    currentPuzzle.split("").forEach((c,i)=>{
        let d = document.createElement("div");
        d.className = "cell";

        if(c === " ") {
            d.innerText = "";
        }
        else if(revealed[i]) {
            d.innerText = c;
        }
        else {
            d.classList.add("hidden");
        }

        grid.appendChild(d);
    });
}

function renderKeyboard(){
    keyboard.innerHTML = "";

    for(let i=65;i<=90;i++){
        let l = String.fromCharCode(i);

        let btn = document.createElement("button");
        btn.innerText = l;

        btn.onclick = ()=>guess(l, btn);

        keyboard.appendChild(btn);
    }
}

function spinWheel(){
    let val = wheelValues[Math.floor(Math.random()*wheelValues.length)];
    wheelResult.innerText = val;

    if(val === "LOSE"){
        nextPlayer();
    }
    else if(val === "SNAKE"){
        players[currentPlayer] = 0;
        nextPlayer();
    }
    else{
        window.spin = val;
    }

    updateScores();
}

function guess(letter, btn){
    btn.classList.add("used");

    let found = false;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c === letter){
            revealed[i] = true;
            players[currentPlayer] += window.spin || 0;
            found = true;
        }
    });

    if(!found) nextPlayer();

    renderGrid();
    updateScores();

    if(!revealed.includes(false)){
        alert("Solved!");
        nextRound();
    }
}

function buyVowel(){
    let v = prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;

    players[currentPlayer] -= 100;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c === v) revealed[i] = true;
    });

    renderGrid();
    updateScores();
}

function nextPlayer(){
    currentPlayer = (currentPlayer+1)%3;
}

function updateScores(){
    scoreboard.innerHTML = "";

    players.forEach((p,i)=>{
        let div = document.createElement("div");
        div.className = "player";
        if(i === currentPlayer) div.classList.add("active-player");

        div.innerText = `P${i+1}: ₹${p}`;
        scoreboard.appendChild(div);
    });
}

function nextRound(){

    if(currentRound === 2){
        let max = Math.max(...players);
        currentPlayer = players.indexOf(max);
    }

    currentRound++;

    if(currentRound >= 4){
        alert("Game Over!");
        return;
    }

    loadRound();
}

</script>

</body>
</html>
