<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Fixed</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle, #1a0033, #000);
    color:white;
}

/* LAYOUT */
.game {
    display:flex;
    justify-content:space-around;
    padding:15px;
    flex-wrap:wrap;
}

/* PUZZLE */
.puzzle-board {
    background:#0b5d3b;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 15px gold;
    max-width:600px;
}

.grid {
    display:grid;
    grid-template-columns: repeat(12, 35px);
    gap:6px;
    justify-content:center;
}

.cell {
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    background:#083c28;
    color:white;
}

.revealed {
    background:white;
    color:black;
}

/* RIGHT PANEL */
.right {
    text-align:center;
}

/* WHEEL */
.wheel {
    width:180px;
    height:180px;
    border-radius:50%;
    background: conic-gradient(
        gold 0deg 45deg,
        orange 45deg 90deg,
        yellow 90deg 135deg,
        red 135deg 180deg,
        green 180deg 225deg,
        cyan 225deg 270deg,
        pink 270deg 315deg,
        purple 315deg 360deg
    );
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* BUTTONS */
button {
    padding:8px 12px;
    margin:5px;
    cursor:pointer;
}

/* KEYBOARD */
.keyboard {
    display:grid;
    grid-template-columns: repeat(8, 40px);
    justify-content:center;
    gap:5px;
    margin-top:10px;
}

.keyboard button {
    height:40px;
}

.used {
    background:grey;
    pointer-events:none;
}

/* SCORE */
.scoreboard {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

.player {
    padding:8px 12px;
    border:2px solid white;
}

.active-player {
    border:2px solid gold;
}

</style>
</head>

<body>

<div class="game">

    <!-- PUZZLE -->
    <div class="puzzle-board">
        <div id="grid" class="grid"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="wheel">🎡</div>

        <div id="wheelResult"></div>

        <button onclick="spinWheel()">Spin</button>
        <button onclick="buyVowel()">Vowel ₹10000</button>
        <button onclick="solvePuzzle()">Solve</button>
        <button onclick="nextRound()">Next Round</button>

        <div class="scoreboard" id="scoreboard"></div>

    </div>

</div>

<div class="keyboard" id="keyboard"></div>

<script>

let puzzles=["HELLO WORLD","INDIA IS GREAT","CODE GAME","FINAL ROUND"];
let currentRound=0;
let currentPuzzle="";
let revealed=[];
let players=[0,0,0];
let currentPlayer=0;
let spinValue=0;

const wheelValues=[10000,35000,50000,75000,100000,"SNAKE","LOSE"];

function loadRound(){
    currentPuzzle=puzzles[currentRound];
    revealed=Array(currentPuzzle.length).fill(false);
    renderGrid();
    renderKeyboard();
    updateScore();
}

function renderGrid(){
    grid.innerHTML="";

    let row=[];
    currentPuzzle.split("").forEach((c,i)=>{
        row.push({char:c,index:i});

        if(row.length===12){
            drawRow(row);
            row=[];
        }
    });

    if(row.length>0) drawRow(row);
}

function drawRow(row){
    row.forEach(item=>{
        let d=document.createElement("div");
        d.className="cell";

        if(item.char===" ") d.innerText="";
        else if(revealed[item.index]){
            d.classList.add("revealed");
            d.innerText=item.char;
        }

        grid.appendChild(d);
    });
}

function renderKeyboard(){
    keyboard.innerHTML="";
    for(let i=65;i<=90;i++){
        let l=String.fromCharCode(i);
        let btn=document.createElement("button");
        btn.innerText=l;
        btn.onclick=()=>guess(l,btn);
        keyboard.appendChild(btn);
    }
}

function spinWheel(){
    let val=wheelValues[Math.floor(Math.random()*wheelValues.length)];
    wheelResult.innerText="Result: "+val;

    if(val==="LOSE") nextPlayer();
    else if(val==="SNAKE"){ players[currentPlayer]=0; nextPlayer(); }
    else spinValue=val;

    updateScore();
}

function guess(l,btn){
    btn.classList.add("used");
    let found=false;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===l){
            revealed[i]=true;
            players[currentPlayer]+=spinValue;
            found=true;
        }
    });

    if(!found) nextPlayer();

    renderGrid();
    updateScore();
}

function buyVowel(){
    let v=prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;

    players[currentPlayer]-=10000;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===v) revealed[i]=true;
    });

    renderGrid();
    updateScore();
}

function solvePuzzle(){
    revealed=Array(currentPuzzle.length).fill(true);
    renderGrid();
    nextRound();
}

function nextPlayer(){
    currentPlayer=(currentPlayer+1)%3;
}

function updateScore(){
    scoreboard.innerHTML="";
    players.forEach((p,i)=>{
        let d=document.createElement("div");
        d.className="player";
        if(i===currentPlayer) d.classList.add("active-player");
        d.innerText=`P${i+1}: ₹${p}`;
        scoreboard.appendChild(d);
    });
}

function nextRound(){
    currentRound++;

    if(currentRound>=4){
        alert("Game Over");
        return;
    }

    loadRound();
}

/* START */
loadRound();

</script>

</body>
    </html>
