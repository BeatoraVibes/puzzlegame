<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Elite</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle, #1a0033, #000);
    color:white;
}

/* SCREEN */
.screen { display:none; }
.active { display:block; text-align:center; }

/* ENTRY */
input {
    padding:10px;
    margin:5px;
    width:250px;
}

/* GAME LAYOUT */
.game {
    display:flex;
    justify-content:space-around;
    padding:20px;
}

/* PUZZLE BOARD */
.puzzle-board {
    background:#0b5d3b;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 20px gold;
}

.grid {
    display:grid;
    grid-template-columns: repeat(12, 45px);
    gap:8px;
}

.cell {
    width:45px;
    height:45px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.hidden {
    background:#ddd;
}

/* WHEEL */
.wheel {
    width:220px;
    height:220px;
    border-radius:50%;
    background: conic-gradient(
        gold 0deg 30deg,
        orange 30deg 60deg,
        yellow 60deg 90deg,
        red 90deg 120deg,
        green 120deg 150deg,
        cyan 150deg 180deg,
        gold 180deg 210deg,
        orange 210deg 240deg,
        yellow 240deg 270deg,
        red 270deg 300deg,
        green 300deg 330deg,
        cyan 330deg 360deg
    );
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-weight:bold;
}

/* BUTTONS */
button {
    padding:10px;
    margin:5px;
    cursor:pointer;
}

/* KEYBOARD */
.keyboard {
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    max-width:400px;
    margin:20px auto;
    gap:5px;
}

.keyboard button {
    height:40px;
}

.used {
    background:grey;
    pointer-events:none;
}

/* SCORE */
.scoreboard {
    display:flex;
    justify-content:center;
    gap:15px;
}

.player {
    padding:10px 20px;
    border:2px solid white;
}

.active-player {
    border:2px solid gold;
}

</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen" class="screen active">
    <h1>Enter Puzzles</h1>
    <input id="p1"><br>
    <input id="p2"><br>
    <input id="p3"><br>
    <input id="p4"><br>
    <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div class="game">

    <!-- PUZZLE -->
    <div class="puzzle-board">
        <div id="grid" class="grid"></div>
    </div>

    <!-- RIGHT -->
    <div>
        <div class="wheel">🎡</div>

        <button onclick="spinWheel()">Spin</button>
        <button onclick="buyVowel()">Buy Vowel ₹10000</button>
        <button onclick="solvePuzzle()">Solve</button>

        <h2 id="wheelResult"></h2>

        <div class="scoreboard" id="scoreboard"></div>
    </div>

</div>

<div class="keyboard" id="keyboard"></div>

</div>

<script>

let puzzles=[], currentRound=0;
let players=[0,0,0];
let currentPlayer=0;
let currentPuzzle="", revealed=[];
let spinValue=0;

const wheelValues=[
    10000,35000,50000,75000,100000,
    "SNAKE","LOSE"
];

function startGame(){
    puzzles=[p1.value.toUpperCase(),p2.value.toUpperCase(),p3.value.toUpperCase(),p4.value.toUpperCase()];
    entryScreen.classList.remove("active");
    gameScreen.classList.add("active");
    loadRound();
}

function loadRound(){
    currentPuzzle=puzzles[currentRound];
    revealed=Array(currentPuzzle.length).fill(false);
    renderGrid();
    renderKeyboard();
    updateScore();
}

function renderGrid(){
    grid.innerHTML="";
    currentPuzzle.split("").forEach((c,i)=>{
        let d=document.createElement("div");
        d.className="cell";

        if(c===" ") d.innerText="";
        else if(revealed[i]) d.innerText=c;
        else d.classList.add("hidden");

        grid.appendChild(d);
    });
}

function renderKeyboard(){
    keyboard.innerHTML="";
    for(let i=65;i<=90;i++){
        let l=String.fromCharCode(i);
        let btn=document.createElement("button");
        btn.innerText=l;
        btn.onclick=()=>guess(l,btn);
        keyboard.appendChild(btn);
    }
}

function spinWheel(){
    let val=wheelValues[Math.floor(Math.random()*wheelValues.length)];
    wheelResult.innerText=val;

    if(val==="LOSE") nextPlayer();
    else if(val==="SNAKE"){ players[currentPlayer]=0; nextPlayer(); }
    else spinValue=val;

    updateScore();
}

function guess(l,btn){
    btn.classList.add("used");
    let found=false;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===l){
            revealed[i]=true;
            players[currentPlayer]+=spinValue;
            found=true;
        }
    });

    if(!found) nextPlayer();

    renderGrid();
    updateScore();
}

function buyVowel(){
    let v=prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;

    players[currentPlayer]-=10000;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===v) revealed[i]=true;
    });

    renderGrid();
    updateScore();
}

function solvePuzzle(){
    revealed=Array(currentPuzzle.length).fill(true);
    renderGrid();
    alert("Solved!");
    nextRound();
}

function nextPlayer(){
    currentPlayer=(currentPlayer+1)%3;
}

function updateScore(){
    scoreboard.innerHTML="";
    players.forEach((p,i)=>{
        let d=document.createElement("div");
        d.className="player";
        if(i===currentPlayer) d.classList.add("active-player");
        d.innerText=`P${i+1}: ₹${p}`;
        scoreboard.appendChild(d);
    });
}

function nextRound(){
    if(currentRound===2){
        let max=Math.max(...players);
        currentPlayer=players.indexOf(max);
    }

    currentRound++;
    if(currentRound>=4){
        alert("Game Over");
        return;
    }

    loadRound();
}

</script>

</body>
</html>
