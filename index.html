<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Premium</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle, #12002b, #000);
    color:white;
}

/* LAYOUT */
.game {
    display:flex;
    justify-content:space-around;
    padding:15px;
    flex-wrap:wrap;
}

/* PUZZLE */
.puzzle-board {
    background:#0b5d3b;
    padding:15px;
    border-radius:12px;
    box-shadow:0 0 25px gold;
}

.grid {
    display:grid;
    grid-template-columns: repeat(12, 40px);
    gap:6px;
    justify-content:center;
}

.cell {
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    background:#083c28;
}

.revealed {
    background:white;
    color:black;
}

/* WHEEL */
.wheel-container {
    position:relative;
    width:220px;
    height:220px;
    margin:auto;
}

canvas {
    border-radius:50%;
}

.pointer {
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    font-size:25px;
}

/* BUTTONS */
button {
    padding:8px 12px;
    margin:5px;
    cursor:pointer;
}

/* KEYBOARD */
.keyboard {
    display:grid;
    grid-template-columns: repeat(8, 40px);
    justify-content:center;
    gap:5px;
    margin-top:10px;
}

.keyboard button {
    height:40px;
}

.used {
    background:grey;
    pointer-events:none;
}

/* SCORE */
.scoreboard {
    display:flex;
    justify-content:center;
    gap:10px;
}

.player {
    padding:8px 12px;
    border:2px solid white;
}

.active-player {
    border:2px solid gold;
}

</style>
</head>

<body>

<div class="game">

    <!-- PUZZLE -->
    <div class="puzzle-board">
        <div id="grid" class="grid"></div>
    </div>

    <!-- RIGHT -->
    <div>

        <div class="wheel-container">
            <div class="pointer">▲</div>
            <canvas id="wheelCanvas" width="220" height="220"></canvas>
        </div>

        <h3 id="wheelResult"></h3>

        <button onclick="spinWheel()">Spin</button>
        <button onclick="buyVowel()">Vowel ₹10000</button>
        <button onclick="solvePuzzle()">Solve</button>
        <button onclick="nextRound()">Next Round</button>

        <div class="scoreboard" id="scoreboard"></div>

    </div>

</div>

<div class="keyboard" id="keyboard"></div>

<script>

/* DATA */
let puzzles=["HELLO WORLD","INDIA IS GREAT","GAME DEVELOPMENT","FINAL ROUND"];
let currentRound=0, currentPuzzle="", revealed=[];
let players=[0,0,0], currentPlayer=0;
let spinValue=0;

/* WHEEL */
const segments=[
    "10000","35000","50000","75000","100000","SNAKE","LOSE"
];

const colors=["gold","orange","yellow","red","green","cyan","purple"];

let angle=0;

/* DRAW WHEEL */
const canvas=document.getElementById("wheelCanvas");
const ctx=canvas.getContext("2d");

function drawWheel(){
    let arc=2*Math.PI/segments.length;

    segments.forEach((seg,i)=>{
        ctx.beginPath();
        ctx.fillStyle=colors[i];
        ctx.moveTo(110,110);
        ctx.arc(110,110,100,arc*i+angle,arc*(i+1)+angle);
        ctx.fill();

        ctx.fillStyle="black";
        ctx.font="12px Arial";
        ctx.save();
        ctx.translate(110,110);
        ctx.rotate(arc*i+arc/2+angle);
        ctx.fillText(seg,50,0);
        ctx.restore();
    });
}

/* SPIN */
function spinWheel(){
    let spin=Math.random()*2000+2000;
    let start=angle;

    let duration=2000;
    let startTime=null;

    function animate(t){
        if(!startTime) startTime=t;
        let progress=t-startTime;

        let ease=1-Math.pow(1-progress/duration,3);
        angle=start+(spin*ease*Math.PI/180);

        ctx.clearRect(0,0,220,220);
        drawWheel();

        if(progress<duration){
            requestAnimationFrame(animate);
        } else {
            calculateResult();
        }
    }

    requestAnimationFrame(animate);
}

/* RESULT */
function calculateResult(){
    let deg=(angle*180/Math.PI)%360;
    let segmentIndex=Math.floor((360-deg)/(360/segments.length))%segments.length;
    let result=segments[segmentIndex];

    wheelResult.innerText="Result: "+result;

    if(result==="LOSE") nextPlayer();
    else if(result==="SNAKE"){ players[currentPlayer]=0; nextPlayer(); }
    else spinValue=parseInt(result);

    updateScore();
}

/* GAME */
function loadRound(){
    currentPuzzle=puzzles[currentRound];
    revealed=Array(currentPuzzle.length).fill(false);
    renderGrid();
    renderKeyboard();
    updateScore();
}

function renderGrid(){
    grid.innerHTML="";
    currentPuzzle.split("").forEach((c,i)=>{
        let d=document.createElement("div");
        d.className="cell";

        if(c===" ") d.innerText="";
        else if(revealed[i]){
            d.classList.add("revealed");
            d.innerText=c;
        }

        grid.appendChild(d);
    });
}

function renderKeyboard(){
    keyboard.innerHTML="";
    for(let i=65;i<=90;i++){
        let l=String.fromCharCode(i);
        let btn=document.createElement("button");
        btn.innerText=l;
        btn.onclick=()=>guess(l,btn);
        keyboard.appendChild(btn);
    }
}

function guess(l,btn){
    btn.classList.add("used");
    let found=false;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===l){
            revealed[i]=true;
            players[currentPlayer]+=spinValue;
            found=true;
        }
    });

    if(!found) nextPlayer();

    renderGrid();
    updateScore();
}

function buyVowel(){
    let v=prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;

    players[currentPlayer]-=10000;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===v) revealed[i]=true;
    });

    renderGrid();
    updateScore();
}

function solvePuzzle(){
    revealed=Array(currentPuzzle.length).fill(true);
    renderGrid();
    nextRound();
}

function nextPlayer(){
    currentPlayer=(currentPlayer+1)%3;
}

function updateScore(){
    scoreboard.innerHTML="";
    players.forEach((p,i)=>{
        let d=document.createElement("div");
        d.className="player";
        if(i===currentPlayer) d.classList.add("active-player");
        d.innerText=`P${i+1}: ₹${p}`;
        scoreboard.appendChild(d);
    });
}

function nextRound(){
    currentRound++;
    if(currentRound>=4){
        alert("Game Over");
        return;
    }
    loadRound();
}

/* INIT */
drawWheel();
loadRound();

</script>

</body>
</html>
