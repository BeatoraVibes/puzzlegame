<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
}

button {
    padding: 10px;
    margin: 5px;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: repeat(12, 40px);
    gap: 5px;
    justify-content: center;
    margin: 20px 0;
}

.cell {
    width: 40px;
    height: 40px;
    border: 1px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.keyboard button {
    width: 35px;
}

.used {
    background: grey;
    pointer-events: none;
}

.hidden {
    background: #222;
}

.wheel {
    margin: 20px;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎡 Wheel Game</h1>

<!-- PUZZLE INPUT -->
<h3>Enter All 4 Round Puzzles</h3>
<input id="p1" placeholder="Round 1"><br>
<input id="p2" placeholder="Round 2"><br>
<input id="p3" placeholder="Round 3"><br>
<input id="p4" placeholder="Final Round"><br><br>

<button onclick="startGame()">Start Game</button>

<h2 id="roundTitle"></h2>

<!-- SCORE -->
<div id="scores"></div>

<!-- WHEEL -->
<div class="wheel">
    <button onclick="spinWheel()">SPIN 🎡</button>
    <h3 id="wheelResult"></h3>
</div>

<!-- PUZZLE -->
<div id="grid" class="grid"></div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard"></div>

<button onclick="buyVowel()">Buy Vowel (₹100)</button>
<button onclick="nextRound()">Next Round ➡️</button>

</div>

<script>

let puzzles = [];
let currentRound = 0;
let players = [0,0,0];
let currentPlayer = 0;
let currentPuzzle = "";
let revealed = [];

const wheelValues = [
    1,2000,5000,10000,20000,50000,75000,1000,100000,
    "SNAKE","LOSE TURN"
];

function startGame(){
    puzzles = [
        document.getElementById("p1").value.toUpperCase(),
        document.getElementById("p2").value.toUpperCase(),
        document.getElementById("p3").value.toUpperCase(),
        document.getElementById("p4").value.toUpperCase()
    ];

    currentRound = 0;
    players = [0,0,0];
    loadRound();
}

function loadRound(){
    currentPuzzle = puzzles[currentRound];
    revealed = Array(currentPuzzle.length).fill(false);
    currentPlayer = 0;

    document.getElementById("roundTitle").innerText =
        currentRound === 3 ? "FINAL ROUND" : "ROUND " + (currentRound+1);

    renderGrid();
    renderKeyboard();
    updateScores();
}

function renderGrid(){
    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    currentPuzzle.split("").forEach((char,i)=>{
        let div = document.createElement("div");
        div.className = "cell";

        if(char === " "){
            div.innerText = "";
        } else if(revealed[i]){
            div.innerText = char;
        } else {
            div.classList.add("hidden");
        }

        grid.appendChild(div);
    });
}

function renderKeyboard(){
    let kb = document.getElementById("keyboard");
    kb.innerHTML = "";

    for(let i=65;i<=90;i++){
        let letter = String.fromCharCode(i);

        let btn = document.createElement("button");
        btn.innerText = letter;

        btn.onclick = ()=>guess(letter, btn);

        kb.appendChild(btn);
    }
}

function spinWheel(){
    let val = wheelValues[Math.floor(Math.random()*wheelValues.length)];
    document.getElementById("wheelResult").innerText = val;

    if(val === "LOSE TURN"){
        nextPlayer();
    }
    else if(val === "SNAKE"){
        players[currentPlayer] = 0;
        updateScores();
        nextPlayer();
    }
    else{
        window.currentSpin = val;
    }
}

function guess(letter, btn){
    btn.classList.add("used");

    let found = false;

    currentPuzzle.split("").forEach((char,i)=>{
        if(char === letter){
            revealed[i] = true;
            found = true;
            players[currentPlayer] += window.currentSpin || 0;
        }
    });

    if(!found){
        nextPlayer();
    }

    renderGrid();
    updateScores();

    if(!revealed.includes(false)){
        alert("Solved!");
        nextRound();
    }
}

function buyVowel(){
    let vowel = prompt("Enter vowel (A,E,I,O,U)").toUpperCase();

    if(!"AEIOU".includes(vowel)) return;

    players[currentPlayer] -= 100;

    currentPuzzle.split("").forEach((char,i)=>{
        if(char === vowel){
            revealed[i] = true;
        }
    });

    renderGrid();
    updateScores();
}

function nextPlayer(){
    currentPlayer = (currentPlayer + 1) % 3;
}

function updateScores(){
    document.getElementById("scores").innerHTML =
        `P1: ₹${players[0]} | P2: ₹${players[1]} | P3: ₹${players[2]}<br>
         Turn: Player ${currentPlayer+1}`;
}

function nextRound(){

    if(currentRound === 2){
        // FINAL ROUND -> highest player only
        let max = Math.max(...players);
        currentPlayer = players.indexOf(max);
    }

    currentRound++;

    if(currentRound >= 4){
        alert("Game Over!");
        return;
    }

    loadRound();
}

</script>

</body>
  </html>
