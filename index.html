<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Pro+</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle, #1a0033, #000);
    color: white;
}

/* SCREENS */
.screen { display:none; }
.active { display:block; }

/* ENTRY */
#entryScreen {
    text-align:center;
    margin-top:100px;
}

input {
    padding:10px;
    margin:5px;
    width:250px;
}

button {
    cursor:pointer;
}

/* GAME LAYOUT */
.game {
    display:flex;
    justify-content:space-between;
    padding:20px;
}

/* LEFT PUZZLE */
.puzzle-box {
    border:4px solid gold;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px gold;
}

.grid {
    display:grid;
    grid-template-columns: repeat(12, 45px);
    gap:8px;
}

.cell {
    width:45px;
    height:45px;
    background:#003333;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.hidden {
    background:#002222;
}

/* RIGHT PANEL */
.right {
    text-align:center;
}

/* WHEEL */
.wheel {
    width:220px;
    height:220px;
    border-radius:50%;
    background: conic-gradient(
        gold 0deg 60deg,
        orange 60deg 120deg,
        yellow 120deg 180deg,
        red 180deg 240deg,
        green 240deg 300deg,
        cyan 300deg 360deg
    );
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.controls button {
    margin:5px;
    padding:10px;
}

/* KEYBOARD */
.keyboard {
    margin-top:20px;
}

.keyboard button {
    width:40px;
    height:40px;
    margin:4px;
}

.used {
    background:grey;
    pointer-events:none;
}

/* SCORE */
.scoreboard {
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.player {
    padding:10px 20px;
    border:2px solid white;
}

.active-player {
    border:2px solid gold;
}

</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen" class="screen active">
    <h1>Enter Puzzles</h1>
    <input id="p1" placeholder="Round 1"><br>
    <input id="p2" placeholder="Round 2"><br>
    <input id="p3" placeholder="Round 3"><br>
    <input id="p4" placeholder="Final"><br>
    <button onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div class="game">

    <!-- LEFT -->
    <div class="puzzle-box">
        <div id="grid" class="grid"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="wheel" id="wheel">SPIN</div>

        <div class="controls">
            <button onclick="spinWheel()">Spin</button>
            <button onclick="buyVowel()">Buy Vowel ₹10000</button><br>
            <input id="solveInput" placeholder="Solve full puzzle">
            <button onclick="solvePuzzle()">Solve</button>
        </div>

        <h2 id="wheelResult"></h2>

        <div class="scoreboard" id="scoreboard"></div>

    </div>

</div>

<div class="keyboard" id="keyboard"></div>

</div>

<script>

let puzzles=[], currentRound=0;
let players=[0,0,0];
let currentPlayer=0;
let revealed=[], currentPuzzle="";
let spinValue=0;

const wheelValues=[
    10000,35000,50000,75000,100000,
    "SNAKE","LOSE"
];

function startGame(){
    puzzles=[p1.value.toUpperCase(),p2.value.toUpperCase(),p3.value.toUpperCase(),p4.value.toUpperCase()];
    entryScreen.classList.remove("active");
    gameScreen.classList.add("active");
    loadRound();
}

function loadRound(){
    currentPuzzle=puzzles[currentRound];
    revealed=Array(currentPuzzle.length).fill(false);
    renderGrid();
    renderKeyboard();
    updateScore();
}

function renderGrid(){
    grid.innerHTML="";
    currentPuzzle.split("").forEach((c,i)=>{
        let d=document.createElement("div");
        d.className="cell";
        if(c===" ") d.innerText="";
        else if(revealed[i]) d.innerText=c;
        else d.classList.add("hidden");
        grid.appendChild(d);
    });
}

function renderKeyboard(){
    keyboard.innerHTML="";
    for(let i=65;i<=90;i++){
        let l=String.fromCharCode(i);
        let btn=document.createElement("button");
        btn.innerText=l;
        btn.onclick=()=>guess(l,btn);
        keyboard.appendChild(btn);
    }
}

function spinWheel(){
    let val=wheelValues[Math.floor(Math.random()*wheelValues.length)];
    wheelResult.innerText=val;

    if(val==="LOSE") nextPlayer();
    else if(val==="SNAKE"){ players[currentPlayer]=0; nextPlayer(); }
    else spinValue=val;

    updateScore();
}

function guess(l,btn){
    btn.classList.add("used");
    let found=false;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===l){
            revealed[i]=true;
            players[currentPlayer]+=spinValue;
            found=true;
        }
    });

    if(!found) nextPlayer();

    renderGrid();
    updateScore();

    if(!revealed.includes(false)){
        alert("Solved!");
        nextRound();
    }
}

function buyVowel(){
    let v=prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;

    players[currentPlayer]-=10000;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===v) revealed[i]=true;
    });

    renderGrid();
    updateScore();
}

function solvePuzzle(){
    let ans=solveInput.value.toUpperCase();

    if(ans===currentPuzzle){
        revealed=Array(currentPuzzle.length).fill(true);
        renderGrid();
        alert("Correct!");
        nextRound();
    } else {
        alert("Wrong!");
        nextPlayer();
    }
}

function nextPlayer(){
    currentPlayer=(currentPlayer+1)%3;
}

function updateScore(){
    scoreboard.innerHTML="";
    players.forEach((p,i)=>{
        let d=document.createElement("div");
        d.className="player";
        if(i===currentPlayer) d.classList.add("active-player");
        d.innerText=`P${i+1}: ₹${p}`;
        scoreboard.appendChild(d);
    });
}

function nextRound(){
    if(currentRound===2){
        let max=Math.max(...players);
        currentPlayer=players.indexOf(max);
    }

    currentRound++;

    if(currentRound>=4){
        alert("Game Over");
        return;
    }

    loadRound();
}

</script>

</body>
</html>
