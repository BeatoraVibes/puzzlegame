<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Premium</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at center, #1a0033, #000 80%);
    color:white;
}

/* LAYOUT */
.game {
    display:flex;
    justify-content:space-around;
    padding:20px;
    flex-wrap:wrap;
}

/* PUZZLE BOARD */
.puzzle-board {
    background:#0b5d3b;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 25px gold, 0 0 50px rgba(255,215,0,0.4);
}

.grid {
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* CELLS */
.cell {
    width:50px;
    height:50px;
    margin:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    background:#0a3d2a;
    color:transparent;
    border-radius:6px;
    transition: all 0.4s ease;
}

.revealed {
    background:white;
    color:black;
    transform: rotateY(360deg);
    box-shadow: 0 0 10px gold;
}

/* WHEEL */
.wheel-container {
    position:relative;
    width:240px;
    height:240px;
    margin:auto;
}

canvas {
    border-radius:50%;
}

.pointer {
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
}

/* BUTTONS */
button {
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
    border:none;
    border-radius:6px;
}

/* KEYBOARD */
.keyboard {
    display:grid;
    grid-template-columns: repeat(8, 60px);
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

.keyboard button {
    height:55px;
    font-size:18px;
    font-weight:bold;
    background:white;
}

.used {
    background:#555 !important;
    color:#ccc;
    transform: scale(0.9);
}

/* SCORE */
.scoreboard {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

.player {
    padding:10px 15px;
    border:2px solid white;
}

.active-player {
    border:2px solid gold;
}

</style>
</head>

<body>

<div class="game">

    <!-- PUZZLE -->
    <div class="puzzle-board">
        <div id="grid" class="grid"></div>
    </div>

    <!-- RIGHT -->
    <div>

        <div class="wheel-container">
            <div class="pointer">▲</div>
            <canvas id="wheelCanvas" width="240" height="240"></canvas>
        </div>

        <h3 id="wheelResult"></h3>

        <button onclick="spinWheel()">Spin</button>
        <button onclick="buyVowel()">Vowel ₹10000</button>
        <button onclick="solvePuzzle()">Solve</button>
        <button onclick="nextRound()">Next Round</button>

        <div class="scoreboard" id="scoreboard"></div>

    </div>

</div>

<div class="keyboard" id="keyboard"></div>

<script>

/* DATA */
let puzzles=["HELLO WORLD","INDIA IS GREAT","GAME DEVELOPMENT","FINAL ROUND"];
let currentRound=0;
let currentPuzzle="";
let revealed=[];
let players=[0,0,0];
let currentPlayer=0;
let spinValue=0;

/* WHEEL */
const segments=["10000","35000","50000","75000","100000","SNAKE","LOSE"];
const colors=["gold","orange","yellow","red","green","cyan","purple"];
let angle=0;

const canvas=document.getElementById("wheelCanvas");
const ctx=canvas.getContext("2d");

function drawWheel(){
    let arc=2*Math.PI/segments.length;

    segments.forEach((seg,i)=>{
        ctx.beginPath();
        ctx.fillStyle=colors[i];
        ctx.moveTo(120,120);
        ctx.arc(120,120,110,arc*i+angle,arc*(i+1)+angle);
        ctx.fill();

        ctx.fillStyle="black";
        ctx.font="14px Arial";
        ctx.save();
        ctx.translate(120,120);
        ctx.rotate(arc*i+arc/2+angle);
        ctx.fillText(seg,60,0);
        ctx.restore();
    });
}

/* SPIN */
function spinWheel(){
    let spin=Math.random()*2000+2000;
    let start=angle;
    let duration=2000;
    let startTime=null;

    function animate(t){
        if(!startTime) startTime=t;
        let progress=t-startTime;
        let ease=1-Math.pow(1-progress/duration,3);

        angle=start+(spin*ease*Math.PI/180);

        ctx.clearRect(0,0,240,240);
        drawWheel();

        if(progress<duration){
            requestAnimationFrame(animate);
        } else calculateResult();
    }

    requestAnimationFrame(animate);
}

/* RESULT */
function calculateResult(){
    let deg=(angle*180/Math.PI)%360;
    let index=Math.floor((360-deg)/(360/segments.length))%segments.length;
    let result=segments[index];

    wheelResult.innerText="Result: "+result;

    if(result==="LOSE") nextPlayer();
    else if(result==="SNAKE"){ players[currentPlayer]=0; nextPlayer(); }
    else spinValue=parseInt(result);

    updateScore();
}

/* PUZZLE RENDER */
function renderGrid(){
    grid.innerHTML="";

    let words=currentPuzzle.split(" ");
    let rows=[], currentRow="";

    words.forEach(word=>{
        if((currentRow+word).length<=12){
            currentRow+=(currentRow?" ":"")+word;
        } else {
            rows.push(currentRow);
            currentRow=word;
        }
    });
    if(currentRow) rows.push(currentRow);

    rows.forEach(row=>{
        let rowDiv=document.createElement("div");
        rowDiv.style.display="flex";
        rowDiv.style.justifyContent="center";
        rowDiv.style.gap="5px";

        row.split("").forEach((char)=>{
            let cell=document.createElement("div");
            cell.className="cell";

            let index=currentPuzzle.indexOf(char);

            if(char===" ") cell.style.visibility="hidden";
            else if(revealed[index]){
                cell.classList.add("revealed");
                cell.innerText=char;
            }

            rowDiv.appendChild(cell);
        });

        grid.appendChild(rowDiv);
    });
}

/* KEYBOARD */
function renderKeyboard(){
    keyboard.innerHTML="";
    for(let i=65;i<=90;i++){
        let l=String.fromCharCode(i);
        let btn=document.createElement("button");
        btn.innerText=l;
        btn.onclick=()=>guess(l,btn);
        keyboard.appendChild(btn);
    }
}

/* GUESS */
function guess(letter,btn){
    btn.classList.add("used");
    let found=false;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===letter){
            found=true;
            setTimeout(()=>{
                revealed[i]=true;
                renderGrid();
            }, i*100);

            players[currentPlayer]+=spinValue;
        }
    });

    if(!found) nextPlayer();
    updateScore();
}

/* VOWEL */
function buyVowel(){
    let v=prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;

    players[currentPlayer]-=10000;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===v) revealed[i]=true;
    });

    renderGrid();
    updateScore();
}

/* SOLVE */
function solvePuzzle(){
    revealed=Array(currentPuzzle.length).fill(true);
    renderGrid();
    nextRound();
}

/* PLAYER */
function nextPlayer(){
    currentPlayer=(currentPlayer+1)%3;
}

function updateScore(){
    scoreboard.innerHTML="";
    players.forEach((p,i)=>{
        let d=document.createElement("div");
        d.className="player";
        if(i===currentPlayer) d.classList.add("active-player");
        d.innerText=`P${i+1}: ₹${p}`;
        scoreboard.appendChild(d);
    });
}

/* ROUND */
function nextRound(){
    currentRound++;
    if(currentRound>=4){
        alert("Game Over");
        return;
    }
    loadRound();
}

function loadRound(){
    currentPuzzle=puzzles[currentRound];
    revealed=Array(currentPuzzle.length).fill(false);
    renderGrid();
    renderKeyboard();
    updateScore();
}

/* INIT */
drawWheel();
loadRound();

</script>

</body>
</html>
