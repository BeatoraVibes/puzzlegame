<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Final</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle,#1a0033,#000);
    color:white;
}

/* SCREENS */
.screen{display:none;}
.active{display:block;}

/* ENTRY */
#entry{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

#entry input,#entry select{
    width:280px;
    padding:10px;
    margin:5px;
    text-align:center;
}

/* GAME */
.game{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

/* BOARD */
.board{
    background:#0b5d3b;
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 20px gold;
    max-width:95%;
}

.grid{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.row{
    display:flex;
    justify-content:center;
}

.cell{
    width:35px;
    height:35px;
    margin:2px;
    background:#083c28;
    display:flex;
    align-items:center;
    justify-content:center;
}

.revealed{
    background:white;
    color:black;
}

/* RIGHT PANEL */
.right{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

/* WHEEL */
.wheel{
    width:180px;
    height:180px;
    border-radius:50%;
    background: conic-gradient(
        gold,orange,yellow,red,green,cyan,purple,gold
    );
    box-shadow:0 0 15px gold;
}

/* BUTTONS */
.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:5px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

/* KEYBOARD */
.keyboard{
    display:grid;
    grid-template-columns: repeat(8, 45px);
    justify-content:center;
    gap:5px;
    margin-top:10px;
}

.keyboard button{
    height:40px;
}

/* SCORE */
.scoreboard{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    justify-content:center;
}

.player{
    padding:5px;
    border:2px solid white;
}

.active-player{
    border:2px solid gold;
    box-shadow:0 0 10px gold;
}

</style>
</head>

<body>

<!-- ENTRY -->
<div id="entry" class="screen active">

<h3>Select Players</h3>
<select id="playerCount">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3" selected>3</option>
</select>

<h3>Player Names</h3>
<input id="n1" placeholder="Player 1">
<input id="n2" placeholder="Player 2">
<input id="n3" placeholder="Player 3">

<h3>Puzzles</h3>
<input id="p1">
<input id="p2">
<input id="p3">
<input id="p4">

<button onclick="startGame()">Start Game</button>

</div>

<!-- GAME -->
<div id="game" class="screen">

<div class="game">

<div class="board">
    <div id="grid" class="grid"></div>
</div>

<div class="right">

<div class="wheel"></div>

<h3 id="result"></h3>

<div class="controls">
    <button onclick="spin()">Spin</button>
    <button onclick="buyVowel()">Vowel ₹10000</button>
    <button onclick="solve()">Solve</button>
    <button onclick="nextRound()">Next</button>
    <button onclick="restartGame()">Restart</button>
</div>

<div id="scoreboard" class="scoreboard"></div>

</div>

</div>

<div id="keyboard" class="keyboard"></div>

</div>

<script>

let puzzles=[],currentRound=0;
let currentPuzzle="",revealed=[];
let players=[],playerNames=[];
let currentPlayer=0,totalPlayers=3;
let spinValue=0;

const values=[10000,35000,50000,75000,100000,"SNAKE","LOSE"];

/* PLAYER INPUT FIX */
playerCount.addEventListener("change",()=>{
    let c=parseInt(playerCount.value);
    n2.style.display=c>=2?"block":"none";
    n3.style.display=c===3?"block":"none";
});

/* START */
function startGame(){

    totalPlayers=parseInt(playerCount.value);

    playerNames=[
        n1.value || "Player 1",
        n2.value || "Player 2",
        n3.value || "Player 3"
    ].slice(0,totalPlayers);

    players=new Array(totalPlayers).fill(0);
    currentPlayer=0;

    puzzles=[
        p1.value.toUpperCase(),
        p2.value.toUpperCase(),
        p3.value.toUpperCase(),
        p4.value.toUpperCase()
    ];

    entry.classList.remove("active");
    game.classList.add("active");

    loadRound();
}

/* LOAD */
function loadRound(){
    currentPuzzle=puzzles[currentRound];
    revealed=Array(currentPuzzle.length).fill(false);
    renderGrid();
    renderKeyboard();
    updateScore();
}

/* GRID */
function renderGrid(){
    grid.innerHTML="";

    let words=currentPuzzle.split(" ");
    let row="";

    words.forEach(word=>{
        if((row+word).length<=12){
            row+=(row?" ":"")+word;
        }else{
            drawRow(row);
            row=word;
        }
    });

    if(row) drawRow(row);
}

function drawRow(text){
    let rowDiv=document.createElement("div");
    rowDiv.className="row";

    let startIndex=0;

    text.split("").forEach((char)=>{
        let cell=document.createElement("div");
        cell.className="cell";

        if(char===" "){
            cell.style.visibility="hidden";
        } else {
            let index=currentPuzzle.indexOf(char,startIndex);
            startIndex=index+1;

            if(revealed[index]){
                cell.classList.add("revealed");
                cell.innerText=char;
            }
        }

        rowDiv.appendChild(cell);
    });

    grid.appendChild(rowDiv);
}

/* KEYBOARD */
function renderKeyboard(){
    keyboard.innerHTML="";
    for(let i=65;i<=90;i++){
        let l=String.fromCharCode(i);
        let btn=document.createElement("button");
        btn.innerText=l;
        btn.onclick=()=>guess(l,btn);
        keyboard.appendChild(btn);
    }
}

/* GUESS */
function guess(l,btn){
    btn.disabled=true;
    let found=false;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===l){
            revealed[i]=true;
            players[currentPlayer]+=spinValue;
            found=true;
        }
    });

    if(!found) nextPlayer();

    renderGrid();
    updateScore();
}

/* WHEEL */
function spin(){
    let val=values[Math.floor(Math.random()*values.length)];
    result.innerText="Result: "+val;

    if(val==="LOSE") nextPlayer();
    else if(val==="SNAKE"){ players[currentPlayer]=0; nextPlayer(); }
    else spinValue=val;

    updateScore();
}

/* VOWEL */
function buyVowel(){
    let v=prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;

    players[currentPlayer]-=10000;

    currentPuzzle.split("").forEach((c,i)=>{
        if(c===v) revealed[i]=true;
    });

    renderGrid();
    updateScore();
}

/* SOLVE */
function solve(){
    revealed=Array(currentPuzzle.length).fill(true);
    renderGrid();
}

/* PLAYER */
function nextPlayer(){
    currentPlayer=(currentPlayer+1)%totalPlayers;
}

/* SCORE */
function updateScore(){
    scoreboard.innerHTML="";
    for(let i=0;i<totalPlayers;i++){
        let d=document.createElement("div");
        d.className="player";
        if(i===currentPlayer) d.classList.add("active-player");

        d.innerHTML=`<strong>${playerNames[i]}</strong><br>₹${players[i]}`;
        scoreboard.appendChild(d);
    }
}

/* ROUND */
function nextRound(){
    currentRound++;
    if(currentRound>=4){
        alert("Game Over");
        return;
    }
    loadRound();
}

/* RESTART */
function restartGame(){
    location.reload();
}

</script>

</body>
</html>
