<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game Final</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle,#1a0033,#000);
    color:white;
}

/* ENTRY SCREEN */
#entry{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

input,select{
    width:260px;
    padding:10px;
    margin:5px;
    text-align:center;
}

/* GAME SCREEN */
#game{
    display:none;
}

.game{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

/* BOARD */
.board{
    background:#0b5d3b;
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 20px gold;
}
.grid{display:flex;flex-direction:column;align-items:center;}
.row{display:flex;}
.cell{
    width:35px;height:35px;margin:2px;
    background:#083c28;
    display:flex;align-items:center;justify-content:center;
}
.revealed{background:white;color:black;}

/* RIGHT */
.right{display:flex;flex-direction:column;align-items:center;gap:8px;}

/* WHEEL */
.wheel-container{position:relative;}
canvas{border-radius:50%;}
.pointer{
    position:absolute;
    top:-10px;left:50%;
    transform:translateX(-50%);
}

/* BUTTONS */
.controls{display:flex;flex-wrap:wrap;gap:5px;}
button{padding:8px 12px;cursor:pointer;}

/* KEYBOARD */
.keyboard{
    display:grid;
    grid-template-columns: repeat(8, 45px);
    justify-content:center;
    gap:5px;margin-top:10px;
}
.keyboard button{height:40px;}

/* SCORE */
.scoreboard{display:flex;gap:5px;flex-wrap:wrap;}
.player{padding:5px;border:2px solid white;}
.active-player{border:2px solid gold;}

</style>
</head>

<body>

<!-- ENTRY -->
<div id="entry">
<h3>Select Players</h3>
<select id="playerCount">
<option value="1">1</option>
<option value="2">2</option>
<option value="3" selected>3</option>
</select>

<h3>Player Names</h3>
<input id="n1">
<input id="n2">
<input id="n3">

<h3>Puzzles</h3>
<input id="p1">
<input id="p2">
<input id="p3">
<input id="p4">

<button onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="game">

<div class="game">

<div class="board">
<div id="grid" class="grid"></div>
</div>

<div class="right">

<div class="wheel-container">
<div class="pointer">▲</div>
<canvas id="wheel" width="200" height="200"></canvas>
</div>

<h3 id="result"></h3>

<div class="controls">
<button onclick="spin()">Spin</button>
<button onclick="buyVowel()">Vowel ₹10000</button>
<button onclick="solve()">Solve</button>
<button onclick="nextRound()">Next</button>
<button onclick="restart()">Restart</button>
</div>

<div id="scoreboard" class="scoreboard"></div>

</div>

</div>

<div id="keyboard" class="keyboard"></div>

</div>

<script>

let puzzles=[],currentRound=0;
let currentPuzzle="",revealed=[];
let players=[],playerNames=[];
let currentPlayer=0,totalPlayers=3;
let spinValue=0;

/* UPDATED WHEEL SEGMENTS */
const segments=[
"10000","35000","50000","75000","100000",
"SNAKE","LOSE TURN"
];

const colors=[
"gold","orange","yellow","red","green","cyan","purple"
];

let angle=0;
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

/* DRAW */
function drawWheel(){
    let arc=2*Math.PI/segments.length;
    segments.forEach((seg,i)=>{
        ctx.beginPath();
        ctx.fillStyle=colors[i];
        ctx.moveTo(100,100);
        ctx.arc(100,100,90,arc*i+angle,arc*(i+1)+angle);
        ctx.fill();

        ctx.save();
        ctx.translate(100,100);
        ctx.rotate(arc*i+arc/2+angle);
        ctx.fillStyle="black";
        ctx.font="11px Arial";
        ctx.fillText(seg,40,0);
        ctx.restore();
    });
}

/* SPIN */
function spin(){
    let spin=Math.random()*2000+2000;
    let start=angle;
    let duration=2000;
    let startTime=null;

    function animate(t){
        if(!startTime) startTime=t;
        let progress=t-startTime;
        let ease=1-Math.pow(1-progress/duration,3);

        angle=start+(spin*ease*Math.PI/180);
        ctx.clearRect(0,0,200,200);
        drawWheel();

        if(progress<duration) requestAnimationFrame(animate);
        else resultCalc();
    }

    requestAnimationFrame(animate);
}

/* RESULT */
function resultCalc(){
    let deg=(angle*180/Math.PI)%360;
    let index=Math.floor((360-deg)/(360/segments.length))%segments.length;
    let res=segments[index];

    result.innerText="Result: "+res;

    if(res==="LOSE TURN") nextPlayer();
    else if(res==="SNAKE"){players[currentPlayer]=0;nextPlayer();}
    else spinValue=parseInt(res);

    updateScore();
}

/* START */
function startGame(){

    totalPlayers=parseInt(playerCount.value);

    playerNames=[
        n1.value||"Player 1",
        n2.value||"Player 2",
        n3.value||"Player 3"
    ].slice(0,totalPlayers);

    players=new Array(totalPlayers).fill(0);

    puzzles=[p1.value,p2.value,p3.value,p4.value].map(p=>p.toUpperCase());

    document.getElementById("entry").style.display="none";
    document.getElementById("game").style.display="block";

    drawWheel();
    loadRound();
}

/* RESTART */
function restart(){
    document.getElementById("game").style.display="none";
    document.getElementById("entry").style.display="flex";
}

function loadRound(){
    currentPuzzle=puzzles[currentRound];
    revealed=new Array(currentPuzzle.length).fill(false);
    renderGrid();renderKeyboard();updateScore();
}

/* GRID */
function renderGrid(){
    grid.innerHTML="";
    let words=currentPuzzle.split(" ");
    let row="";
    words.forEach(w=>{
        if((row+w).length<=12) row+=(row?" ":"")+w;
        else{drawRow(row);row=w;}
    });
    if(row) drawRow(row);
}

function drawRow(text){
    let r=document.createElement("div");r.className="row";
    let start=0;
    text.split("").forEach(c=>{
        let cell=document.createElement("div");
        cell.className="cell";

        if(c===" ") cell.style.visibility="hidden";
        else{
            let i=currentPuzzle.indexOf(c,start);
            start=i+1;
            if(revealed[i]){
                cell.classList.add("revealed");
                cell.innerText=c;
            }
        }
        r.appendChild(cell);
    });
    grid.appendChild(r);
}

/* KEYBOARD */
function renderKeyboard(){
    keyboard.innerHTML="";
    for(let i=65;i<=90;i++){
        let l=String.fromCharCode(i);
        let b=document.createElement("button");
        b.innerText=l;
        b.onclick=()=>guess(l,b);
        keyboard.appendChild(b);
    }
}

/* GAME */
function guess(l,b){
    b.disabled=true;
    let found=false;
    currentPuzzle.split("").forEach((c,i)=>{
        if(c===l){revealed[i]=true;players[currentPlayer]+=spinValue;found=true;}
    });
    if(!found) nextPlayer();
    renderGrid();updateScore();
}

function buyVowel(){
    let v=prompt("Enter vowel").toUpperCase();
    if(!"AEIOU".includes(v)) return;
    players[currentPlayer]-=10000;
    currentPuzzle.split("").forEach((c,i)=>{if(c===v) revealed[i]=true;});
    renderGrid();updateScore();
}

function solve(){revealed.fill(true);renderGrid();}

function nextPlayer(){currentPlayer=(currentPlayer+1)%totalPlayers;}

function updateScore(){
    scoreboard.innerHTML="";
    for(let i=0;i<totalPlayers;i++){
        let d=document.createElement("div");
        d.className="player";
        if(i===currentPlayer) d.classList.add("active-player");
        d.innerHTML=`<b>${playerNames[i]}</b><br>₹${players[i]}`;
        scoreboard.appendChild(d);
    }
}

function nextRound(){
    currentRound++;
    if(currentRound>=4){alert("Game Over");return;}
    loadRound();
}

</script>

</body>
</html>
